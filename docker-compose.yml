version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0
    container_name: bidfactory_neo4j
    ports:
      - "7474:7474" # Browser interface
      - "7687:7687" # Bolt protocol for Python connection
    environment:
      - NEO4J_AUTH=neo4j/BidFactoryGraph2026
      # Enable APOC plugin for advanced graph traversals (very standard for GraphRAG)
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
